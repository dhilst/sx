name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: install refactor tools
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          go install golang.org/x/tools/gopls@latest
          go install golang.org/x/tools/cmd/eg@latest

      - name: score this repository
        run: go tool sx .

      # Fails while any shrinking candidate is still detectable, including
      # ones -apply would reject: detection cannot tell the difference without
      # writing to the tree, and -check never writes.
      - name: check for shrinking candidates
        run: go tool sx refactor -check -n 30 .

      # -check must stay read-only. This is the regression guard for that.
      - name: the check must leave the tree untouched
        if: always()
        run: git diff --exit-code
