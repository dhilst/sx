name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Pinned: the transformation models (README, Appendix A) are checked
      # against these versions, and the tests below need them installed -
      # without them the example harness skips instead of running.
      - name: install refactor tools
        env:
          GOTOOLCHAIN: auto # the tools need a newer Go than the module
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          go install golang.org/x/tools/gopls@v0.23.0
          go install golang.org/x/tools/cmd/eg@v0.50.0

      # Includes the test/examples harness: every model's prediction must
      # equal the measured change, and sx must turn each _before.go into its
      # _after.go.
      - name: test
        run: go test ./... -count=1 -timeout 20m

      - name: score this repository
        run: go tool sx .

      # Fails while any shrinking candidate is still detectable, including
      # ones -apply would reject: detection cannot tell the difference without
      # writing to the tree, and -check never writes.
      - name: check for shrinking candidates
        run: go tool sx refactor -check -n 30 .

      # -check must stay read-only. This is the regression guard for that.
      - name: the check must leave the tree untouched
        if: always()
        run: git diff --exit-code
